/* VOICE: sportovní TV přenos – sebevědomý, energický, čitelný na 2 metry
   IDEA: scoreboard z televizního přenosu šipek
   PICTURE: obří kurzivní skóre a žlutý pruh hráče na tahu
   COLOUR and TYPE: téměř černá, sytá žlutá, D zelená, T červená; Barlow Condensed kurzíva
   LAYOUT: mobil na výšku, klávesnice přilepená dole pod palcem */
:root{--bg:#0A0B0F;--s1:#121318;--s2:#15171D;--s3:#1B1D24;--ln:#22242B;--ink:#F4F4F2;--mut:#A3A7B0;--dim:#4A4E58;--acc:#FFD400;--dbl:#19C37D;--tpl:#FF4D4D;--cd:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Barlow,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{overflow-x:clip}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation;text-align:inherit}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.app{max-width:520px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
.game{height:100dvh;min-height:0}
.hdr{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:4px;padding:14px 18px 12px 8px;border-bottom:1px solid var(--ln)}
.ib{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--ink);flex:none}
.ib:disabled{color:var(--dim)}
.h1{margin:0;font:italic 800 32px/1 var(--cd);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cnt{font:700 20px var(--cd);color:var(--mut)}.cnt em{font-style:normal;color:var(--acc)}
.lbl{margin:0;font:700 13px var(--cd);letter-spacing:2.5px;color:var(--mut);text-transform:uppercase}
.pad{padding:18px 20px}
.col{display:flex;flex-direction:column}.g8{gap:8px}.g14{gap:14px}.g22{gap:22px}
.note{margin:0;font-size:13px;color:var(--mut);line-height:1.45}
.seg{display:grid;gap:2px;background:var(--ln);padding:2px}
.seg button{height:50px;background:var(--s1);font:700 19px var(--cd);text-transform:uppercase}
.seg button[aria-pressed=true]{background:var(--acc);color:#0A0B0F;font-style:italic;font-weight:800}
.seg.big button{height:72px;font-size:40px}
.seg.sm button{height:44px;font-size:20px}
.foot{padding:12px 20px calc(22px + env(safe-area-inset-bottom));margin-top:auto}
.cta{width:100%;height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;background:var(--acc);color:#0A0B0F;font:italic 800 24px var(--cd);text-transform:uppercase}
.cta:disabled{opacity:.35}
.btn{min-height:52px;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--s1);border:1px solid var(--ln);font:700 18px var(--cd);letter-spacing:1px;text-transform:uppercase;padding:0 16px;cursor:pointer;text-align:center}
.btn.dash{border-style:dashed;border-color:#3A3D46;background:transparent}
.btn.acc{background:var(--acc);color:#0A0B0F;border-color:var(--acc)}
.btn.red{background:var(--tpl);color:#0A0B0F;border-color:var(--tpl)}
.btn:disabled{opacity:.4}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px;background:var(--ln);padding:2px}
.row2 .btn{border:0}
.tag{align-self:flex-start;color:#0A0B0F;font:italic 800 17px var(--cd);letter-spacing:1px;padding:5px 22px 5px 12px;clip-path:polygon(0 0,100% 0,calc(100% - 12px) 100%,0 100%);margin:0}
.nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--ln);background:#0E0F14;position:sticky;bottom:0;z-index:2}
.nav button{display:flex;justify-content:center;padding:14px 0 calc(18px + env(safe-area-inset-bottom));border-top:3px solid transparent;margin-top:-1px;color:var(--mut);font:700 15px var(--cd);letter-spacing:1.5px}
.nav button[aria-current=page]{border-top-color:var(--acc);color:var(--ink)}
/* domů */
.hero{padding:34px 20px 22px;background:repeating-linear-gradient(135deg,#10121A 0 2px,#0A0B0F 2px 9px);border-bottom:1px solid var(--ln);display:flex;flex-direction:column;gap:6px}
.hero h1{margin:0;font:italic 800 clamp(72px,24vw,96px)/.9 var(--cd);letter-spacing:-1px}
.hero p{margin:0;color:var(--mut)}
.resume{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--acc);color:#0A0B0F;padding:14px 20px;width:100%}
.resume small{display:block;font:700 12px var(--cd);letter-spacing:2px}
.resume b{display:block;font:italic 800 24px/1.05 var(--cd);text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gmr{display:grid;grid-template-columns:40px minmax(0,1fr) 24px;gap:8px;align-items:center;padding:14px 20px;border-top:1px solid var(--ln);width:100%;color:var(--mut)}
.gmr .n{font:700 16px var(--cd);color:var(--acc)}
.gmr b{display:block;font:italic 800 46px/.95 var(--cd);color:var(--ink)}
.gmr span span{font-size:13px}
.gmr:active{background:var(--s1)}
/* hráči */
.prow{display:grid;grid-template-columns:26px 6px minmax(0,1fr) auto auto;align-items:center;gap:10px;min-height:56px;padding:4px 4px 4px 14px;background:var(--s1);border-bottom:1px solid #1E2027;width:100%}
.prow b{font:700 22px var(--cd);text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow i{width:6px;height:28px}

  }
  if (!/^[A-Z0-9]{4,12}$/.test(code)) { S.sheet.err = 'Kód: 4–12 písmen nebo číslic, bez diakritiky.'; return; }
  if (!who) { S.sheet.err = 'Napiš jméno tohoto telefonu (např. své jméno).'; return; }
  S.sheet.err = ''; S.sheet.busy = true; render();
  try {
    await clAuth();
    const {data, error} = await CL.sb.rpc(create ? 'create_office' : 'join_office', {p_code: code, p_device: who});
    if (error) throw error;
    const hadLocal = (LS.get('.p') || []).length + (LS.get('.m') || []).length;
    Object.assign(CL, {on: true, office: data, code, who, ready: false, net: true, gid: null});
    clSaveState();
    S.players = []; S.matches = []; S.current = null; S.result = null;
    await clStart();
    S.sheet = hadLocal && LS.get('.c_up') !== data ? {k: 'clUp'} : null;
    toast((create ? 'Kancelář založena: ' : 'Připojeno ke kanceláři ') + code);
  } catch (e) {
    S.sheet = Object.assign(S.sheet || {k: 'cloud'}, {busy: false, err: e.message === 'office_exists' ? 'Kancelář s tímhle kódem už existuje – zvol Připojit.' : e.message === 'office_not_found' ? 'Kancelář s tímhle kódem neexistuje – zkontroluj kód.' : /anonymous/i.test(e.message || '') ? 'V Supabase není zapnuté anonymní přihlášení (Authentication → Sign In / Providers).' : clIsNet(e) ? 'Nejde se spojit se serverem – zkontroluj internet, adresu a klíč.' : 'Chyba: ' + (e.message || e.code)});
  }
  render();
}
function clDisconnect() {
  try { if (CL.ch && CL.sb) CL.sb.removeChannel(CL.ch); } catch (e) {}
  Object.assign(CL, {on: false, ready: false, ch: null, office: null, code: '', gid: null, live: [], conflict: null});
  LS.set('.c_q', []); CL.q = []; clSaveState(); loadLocal();
}
/* --- čtení ze serveru --- */
async function clLoadPlayers() {
  const {data, error} = await CL.sb.from('players').select('id,name,color,theme').eq('office_id', CL.office).eq('archived', false).order('id');
  if (error) throw error;
  if (CL.q.some(o => o.k === 'p')) return;
  S.players = data.map(p => Object.assign({id: p.id, name: p.name, color: p.color || PALETTE[0]}, p.theme ? {theme: p.theme} : {}));
  CL.pmap = Object.fromEntries(S.players.map(p => [p.id, clSig(p)]));
  LS.set('.c_p', S.players);
}
async function clLoadMatches() {
  const {data, error} = await CL.sb.from('games').select('id,result').eq('office_id', CL.office).eq('status', 'done').order('created_at');
  if (error) throw error;
  const ms = data.map(r => r.result).filter(m => m && m.id && m.sides);
  CL.q.filter(o => o.k === 'd').forEach(o => { if (!ms.some(m => m.id === o.row.id)) ms.push(o.row.result); });
  S.matches = ms; LS.set('.c_m', S.matches);
}
async function clLoadLive() {
  const {data, error} = await CL.sb.from('games').select('id,type,settings,sides,created_by,created_at').eq('office_id', CL.office).eq('status', 'live').order('created_at', {ascending: false});
  if (error) throw error;
  CL.live = data; LS.set('.c_live', CL.live);
}
async function clFetchGame(gid) {
  const [a, b] = await Promise.all([
    CL.sb.from('games').select('*').eq('id', gid).maybeSingle(),
    CL.sb.from('throws').select('seq,n,m,who,device').eq('game_id', gid).eq('undone', false).order('seq')]);
  if (a.error) throw a.error;
  if (b.error) throw b.error;
  return {row: a.data, th: b.data};
}
function clReplay(row, th) {
  const keep = S.current, g = newGame(row.type, row.settings, row.sides);
  g.id = row.id; g.cloud = true; g.startedAt = Date.parse(row.created_at) || g.startedAt;
  S.current = g; REPLAY = true;
  try { th.forEach(t => throwDart(+t.n, +t.m)); } finally { REPLAY = false; S.current = keep; }
  return g;
}
/* Stav hry = šipky ze serveru + to, co ještě čeká ve frontě. */
function clCompose(gid, srv) {
  const undo = new Set(CL.q.filter(o => o.k === 'u' && o.gid === gid).map(o => o.seq));
  const mine = CL.q.filter(o => o.k === 't' && o.gid === gid).map(o => ({seq: o.seq, n: o.n, m: o.m}));
  const all = srv.filter(t => !undo.has(t.seq) && !mine.some(x => x.seq === t.seq)).concat(mine);
  return all.sort((a, b) => a.seq - b.seq);
}
async function clRefreshGame(gid, open) {
  let r;
  try { r = await clFetchGame(gid); } catch (e) { CL.net = !clIsNet(e); clStatus(); return; }
  if (!r.row) { if (open) toast('Hra už neexistuje'); return; }
  if (CL.q.some(o => o.gid === gid && o.k !== 'u') && !open && CL.busy) { CL.need.add(gid); return; }
  const viewing = open || (S.current && S.current.id === gid);
  if (!viewing) return;
  if (r.row.status === 'void') { if (S.current && S.current.id === gid) { S.current = null; CL.gid = null; clSaveState(); persistCurrent(); if (S.view === 'game') { S.view = 'home'; toast('Hru zahodil jiný telefon'); } } render(); return; }
  const g = clReplay(r.row, clCompose(gid, r.th));
  if (r.row.status === 'done' || g.finished) {
    if (!g.finished && r.row.result) { g.finished = true; g.winner = r.row.result.winner; g.info = r.row.result.info; if (r.row.result.places) g.places = r.row.result.places; }
    if (S.current && S.current.id === gid || open) { S.result = stripHist(g); S.current = null; CL.gid = null; clSaveState(); persistCurrent(); if (S.view === 'game' || open) { S.view = 'result'; S.sheet = null; } }
    render(); return;
  }
  S.current = g; CL.gid = gid; clSaveState(); persistCurrent();
  if (open) { S.view = 'game'; S.sheet = null; S.flash = null; wake(); }
  render();
}
function clSoon(gid) {
  CL.need.add(gid);
  clearTimeout(CL.refreshT);
  CL.refreshT = setTimeout(() => { const ids = [...CL.need]; CL.need.clear(); ids.forEach(id => clRefreshGame(id)); }, 150);
}
function clSubscribe() {
  if (CL.ch) return;
  const f = {schema: 'public', filter: 'office_id=eq.' + CL.office};
  CL.ch = CL.sb.channel('kancl-' + CL.office)
    .on('postgres_changes', Object.assign({event: '*', table: 'throws'}, f), p => { const t = p.new || p.old || {}; if (S.current && S.current.id === t.game_id && !CL.busy) clSoon(t.game_id); })
    .on('postgres_changes', Object.assign({event: '*', table: 'games'}, f), p => {
      const gm = p.new || {};
      clLoadLive().then(render, () => {});
      if (gm.status === 'done') clLoadMatches().then(render, () => {});
      if (S.current && S.current.id === gm.id && gm.status !== 'live') clSoon(gm.id);
    })
    .on('postgres_changes', Object.assign({event: '*', table: 'players'}, f), () => { clLoadPlayers().then(render, () => {}); })
    .subscribe(st => { CL.rt = st === 'SUBSCRIBED'; });
}
/* --- zápisy přes frontu --- */
function clPush(op) { CL.q.push(op); clSaveQ(); clStatus(); clFlush(); }
async function clFlush() {
  if (CL.busy || !CL.on || !CL.ready || CL.conflict) return;
  CL.busy = true;
  const wasNet = CL.net;
  let touched = new Set(), offApp = 0;
  try {
    while (CL.q.length && !CL.conflict) {
      const op = CL.q[0], r = await clSend(op);
      if (r === 'net') { CL.net = false; CL.q.forEach(o => { if (o.k === 't') o.off = true; }); clSaveQ(); break; }
      if (r === 'conflict') break;
      if (r === 'again') { offApp++; continue; }
      CL.q.shift(); clSaveQ(); CL.net = true;
      if (op.gid) touched.add(op.gid);
      if (r === 'refresh' && op.gid) touched.add(op.gid);
    }
  } finally { CL.busy = false; clStatus(); if (wasNet !== CL.net) render(); }
  if (offApp) toast('Hody z doby bez internetu doodeslány – za hody z jiného telefonu');
  if (!CL.q.length) { [...touched, ...CL.need].forEach(id => { if (S.current && S.current.id === id) clRefreshGame(id); }); CL.need.clear(); clLoadPlayers().then(render, () => {}); }
  if (CL.conflict) { S.sheet = {k: 'clConf'}; render(); }
}
async function clSend(op) {
  const sb = CL.sb;
  let res;
  try {
    if (op.k === 't') res = await sb.from('throws').insert({game_id: op.gid, office_id: CL.office, seq: op.seq, n: op.n, m: op.m, device: CL.dev, who: CL.who});
    else if (op.k === 'g') res = await sb.from('games').insert(Object.assign({office_id: CL.office}, op.row));
    else if (op.k === 'd') res = await sb.from('games').upsert(Object.assign({office_id: CL.office, updated_at: new Date().toISOString()}, op.row));
    else if (op.k === 'v') res = await sb.from('games').update({status: 'void', updated_at: new Date().toISOString()}).eq('id', op.gid);
    else if (op.k === 'p') res = await sb.from('players').upsert(op.rows.map(p => Object.assign({office_id: CL.office, updated_at: new Date().toISOString()}, p)));
    else if (op.k === 'u') {
      res = await sb.rpc('undo_last', {p_game: op.gid, p_seq: op.seq, p_who: CL.who});
      if (!res.error && res.data === false) { toast('Zpět se neprovedl – mezitím přibyl jiný hod'); return 'refresh'; }
    } else return 'ok';
  } catch (e) { return 'net'; }
  const e = res && res.error;
  if (!e) return 'ok';
  if (clIsNet(e)) return 'net';
  if (op.k === 'g' && e.code === '23505') return 'ok';
  if (op.k === 't' && e.code === '23505') return clOnConflict(op);
  if (/JWT|401|PGRST30/.test(e.code + ' ' + e.message)) { try { await clAuth(); } catch (x) {} return 'net'; }
  toast(op.k === 't' ? 'Hod se nezapsal – hra už skončila' : 'Zápis do kanceláře se nepovedl');
  return 'drop';
}
async function clOnConflict(op) {
  let th;
  try { th = (await clFetchGame(op.gid)).th; } catch (e) { return 'net'; }
  const srv = th.find(t => t.seq === op.seq);
  if (!srv) return 'net';
  if (srv.device === CL.dev && srv.n === op.n && srv.m === op.m) return 'ok';
  if (op.off) { clRenumber(op.gid, op.seq, Math.max(...th.map(t => t.seq)) + 1); return 'again'; }
  CL.conflict = {op, srv};
  return 'conflict';
}
function clRenumber(gid, from, to) { let s = to; CL.q.forEach(o => { if (o.k === 't' && o.gid === gid && o.seq >= from) o.seq = s++; }); clSaveQ(); }
async function clResolve(keep) {
  const c = CL.conflict; if (!c) return;
  if (keep) { let th = []; try { th = (await clFetchGame(c.op.gid)).th; } catch (e) {} clRenumber(c.op.gid, c.op.seq, Math.max(c.op.seq, ...th.map(t => t.seq)) + 1); }
  else { CL.q.splice(CL.q.indexOf(c.op), 1); clRenumber(c.op.gid, c.op.seq, c.op.seq); }
  CL.conflict = null; S.sheet = null; clSaveQ();
  await clRefreshGame(c.op.gid); clFlush();
}
/* --- napojení na herní akce --- */
const clGameRow = g => ({id: g.id, type: g.type, settings: g.settings, sides: g.sides.map(s => ({name: s.name, color: s.color, team: s.team, players: s.players})), created_by: CL.who});
function clNewGame(g) { g.cloud = true; g.seq = 0; CL.gid = g.id; clSaveState(); CL.live.unshift(Object.assign(clGameRow(g), {created_at: new Date().toISOString()})); clPush({k: 'g', gid: g.id, row: clGameRow(g)}); }
function clThrow(g, n, m) { clPush({k: 't', gid: g.id, seq: g.seq, n, m, off: !(CL.ready && CL.net), t: Date.now()}); }
function clUndo() {
  const g = S.current;
  if (!g || !g.history.length) return;
  const last = g.seq, i = CL.q.findIndex(o => o.k === 't' && o.gid === g.id && o.seq === last);
  undo();
  if (i >= 0) { CL.q.splice(i, 1); clSaveQ(); clStatus(); } else clPush({k: 'u', gid: g.id, seq: last});
}
function clMatchDone(m) {
  const row = {id: m.id, type: m.type, settings: m.settings, sides: m.sides.map(s => ({name: s.name, color: s.color, team: s.team, players: s.players})), status: 'done', result: m, created_by: CL.who};
  CL.live = CL.live.filter(x => x.id !== m.id); if (CL.gid === m.id) { CL.gid = null; clSaveState(); }
  clPush({k: 'd', gid: m.id, row});
}
function clVoid(g) { CL.live = CL.live.filter(x => x.id !== g.id); CL.gid = null; clSaveState(); clPush({k: 'v', gid: g.id}); }
const clSig = p => JSON.stringify([p.name, p.color, p.theme || null]);
function clPlayersSync() {
  const prev = CL.pmap || {}, now = {}, rows = [];
  S.players.forEach(p => { now[p.id] = clSig(p); if (prev[p.id] !== now[p.id]) rows.push({id: p.id, name: p.name, color: p.color, theme: p.theme || null, archived: false}); });
  Object.keys(prev).forEach(id => { if (!now[id]) { const [name, color] = JSON.parse(prev[id]); rows.push({id, name, color, archived: true}); } });
  CL.pmap = now;
  if (rows.length) clPush({k: 'p', rows});
}
function clUpload() {
  const lp = LS.get('.p') || [], lm = LS.get('.m') || [], byName = new Map(S.players.map(p => [p.name.toLowerCase(), p.id])), map = {};
  lp.forEach(p => { const ex = byName.get(p.name.toLowerCase()); if (ex) map[p.id] = ex; else { map[p.id] = p.id; S.players.push(Object.assign({id: p.id, name: p.name, color: p.color}, p.theme ? {theme: p.theme} : {})); byName.set(p.name.toLowerCase(), p.id); } });
  persistPlayers();
  const fix = id => map[id] || id;
  let n = 0;
  lm.forEach(m0 => {
    if (S.matches.some(x => x.id === m0.id)) return;
    const m = JSON.parse(JSON.stringify(m0));
    m.sides.forEach(s => s.players.forEach(p => { p.id = fix(p.id); }));
    m.turns.forEach(t => { t.p = fix(t.p); });
    S.matches.push(m); clMatchDone(m); n++;
  });
  LS.set('.c_m', S.matches); LS.set('.c_up', CL.office);
  toast('Nahráno: ' + lp.length + ' ' + plural(lp.length, 'hráč', 'hráči', 'hráčů') + ', ' + n + ' ' + plural(n, 'zápas', 'zápasy', 'zápasů'));
}
function clOpenGame(gid) {
  const row = CL.live.find(x => x.id === gid);
  if (S.current && S.current.id === gid) { S.view = 'game'; wake(); return; }
  if (row && !CL.ready) { const cached = LS.get('.c_c'); S.current = cached && cached.id === gid ? cached : clReplay(Object.assign({created_at: row.created_at}, row), clCompose(gid, [])); if (!Array.isArray(S.current.history)) S.current.history = []; CL.gid = gid; clSaveState(); S.view = 'game'; return; }
  toast('Načítám hru…'); clRefreshGame(gid, true);
}
function clLiveTitle(r) { return (r.type === 'x01' ? r.settings.start : r.type === 'cricket' ? 'CRICKET' : 'COUNT UP') + ' · ' + r.sides.map(s => esc(s.name)).join(' — '); }
setInterval(() => {
  if (!CL.on) return;
  if (!CL.ready) { clStart(); return; }
  if (CL.q.length) clFlush();
  if (!CL.rt && document.visibilityState === 'visible') { if (S.current && S.current.cloud && S.view === 'game' && !CL.q.length) clRefreshGame(S.current.id); if (S.view === 'home') clLoadLive().then(render, () => {}); }
}, 5000);
window.__cl = {CL, S, clRefreshGame, clFlush};
window.addEventListener('online', () => { if (CL.on) { CL.net = true; CL.ready ? clFlush() : clStart(); } });
document.addEventListener('visibilitychange', () => { if (CL.on && document.visibilityState === 'visible') { if (!CL.ready) clStart(); else { clFlush(); if (S.current && S.current.cloud && !CL.q.length) clRefreshGame(S.current.id); clLoadLive().then(render, () => {}); } } });

(function clInit() {
  let d = LS.get('.c_dev'); if (!d) { d = uid(); LS.set('.c_dev', d); } CL.dev = d;
  const st = LS.get('.cl');
  if (st && st.office && clAvail()) { Object.assign(CL, {on: true, code: st.code, office: st.office, who: st.who, gid: st.gid || null}); CL.q = LS.get('.c_q') || []; CL.live = LS.get('.c_live') || []; CL.pmap = Object.fromEntries((LS.get('.c_p') || []).map(p => [p.id, clSig(p)])); }
})();
loadLocal();
if (FILE) S.sync = 'file';
render();
if (!FILE && !CL.on) initRemote();
if (CL.on) clStart();
initVoice();
})();
</script>
